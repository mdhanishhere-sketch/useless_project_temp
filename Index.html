<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MONKEYCAPTCHA™</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="page">


        <div class="verification-box">


            <div class="brand">

                <div class="brand-title">
                    🐒 MONKEYCAPTCHA™
                </div>

                <div class="brand-subtitle">
                    ADVANCED HUMAN VERIFICATION SYSTEM
                </div>

            </div>

            <div id="game">


                <div id="startScreen">

                    <div class="big-monkey">
                        🐒
                    </div>

                    <h1>
                        ARE YOU HUMAN?
                    </h1>

                    <p class="intro">
                        Our highly advanced security system
                        needs to determine whether you are
                        actually a human.
                    </p>

                    <p class="warning">
                        Please complete 10 scientifically
                        questionable verification tests.
                    </p>

                    <button
                        id="startButton"
                        class="main-button">

                        🐒 START VERIFICATION

                    </button>

                </div>


            </div>


            <div class="bottom-area">

                <div class="progress-info">

                    <span id="progressText">
                        Verification not started
                    </span>

                    <span id="levelText">
                        0 / 10
                    </span>

                </div>


                <div class="progress-bar">

                    <div id="progress"></div>

                </div>

            </div>


        </div>


    </div>


    <script src="script.js"></script>

</body>

</html>
